<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Календарь праздников социальной работы</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;800&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef3f1;--surf:#fff;--ink:#17302d;--mute:#5d7471;--line:#d3dfdb;--acc:#1f6f63;--acc-ink:#fff;--bd:#6b4fa0;--today:#f2b632}

:root[data-theme="dark"]{--bg:#0f1918;--surf:#172524;--ink:#e6f0ee;--mute:#93aba7;--line:#2a3f3d;--acc:#4fb8a6;--acc-ink:#0f1918;--bd:#b79cf0;--today:#f2b632}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Onest,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 14px 32px}
h1{font-size:1.25rem;font-weight:800;margin:0 0 2px}
.sub{color:var(--mute);font-size:.85rem;margin:0 0 14px}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.bar h2{flex:1;margin:0;font-size:1.35rem;font-weight:800;text-align:center}
button{font:inherit;color:inherit;cursor:pointer}
.nav{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:1.3rem;line-height:1}
.nav:focus-visible,.cell:focus-visible,.today:focus-visible,.res:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:.75rem;color:var(--mute);padding:4px 0}
.cell{aspect-ratio:1;border:1px solid var(--line);background:var(--surf);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;padding:0}
.cell.we{color:var(--mute)}
.cell.out{visibility:hidden}
.cell.t{box-shadow:inset 0 0 0 2px var(--today)}
.cell.sel{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.dots{display:flex;gap:3px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.dot.b{background:var(--bd)}
.cell.sel .dot{background:var(--acc-ink)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--mute);margin:10px 2px}
.legend span{display:flex;align-items:center;gap:6px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:6px}
.card .d{font-size:.85rem;color:var(--mute);margin:0 0 4px}
.card p.t{margin:0;font-size:1.1rem;font-weight:600}
.tag{display:inline-block;margin-top:8px;font-size:.78rem;padding:2px 10px;border-radius:99px;border:1px solid currentColor;color:var(--acc)}
.tag.b{color:var(--bd)}
.row{display:flex;gap:8px;margin:16px 0 8px}
input{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:0 14px;font:inherit}
.today{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--acc);background:transparent;color:var(--acc);font-weight:600}
.res{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-top:6px}
.res small{display:block;color:var(--mute)}
.note{font-size:.8rem;color:var(--mute);margin:6px 2px}
.hd{display:flex;gap:14px;align-items:center}
.av{flex:none;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:color-mix(in srgb,var(--acc) 16%,var(--surf));border:1px solid var(--acc)}
.av.b{background:color-mix(in srgb,var(--bd) 18%,var(--surf));border-color:var(--bd);color:var(--bd);font-size:1.15rem;font-weight:800;letter-spacing:.02em}
.ph{display:inline-block;margin:10px 14px 0 0;font-size:.85rem;color:var(--acc)}
.ph{cursor:pointer;text-decoration:underline}
.fi{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
button.ph.rm{background:none;border:0;padding:0;font:inherit;font-size:.85rem;cursor:pointer;color:var(--mute)}
.av{padding:0;overflow:hidden;cursor:pointer;color:inherit;font-family:inherit}
.av.b{color:var(--bd)}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.av:focus-visible,.ph:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.card{animation:u .18s ease-out}@keyframes u{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>

<p class="note" id="leap" hidden></p>

const now=new Date();const Y=now.getFullYear();

function render(){
  $('mt').textContent=MN[m]+' '+Y;
  const first=(new Date(Y,m,1).getDay()+6)%7,days=new Date(Y,m+1,0).getDate();
  let h=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>'<div class="dow">'+x+'</div>').join('');
  for(let i=0;i<first;i++)h+='<div class="cell out"></div>';
  for(let d=1;d<=days;d++){
    const t=DATA[key(m,d)],c=['cell'];
    if((first+d-1)%7>4)c.push('we');
    if(d===now.getDate()&&m===now.getMonth())c.push('t');
    if(d===sel)c.push('sel');
    h+='<button class="'+c.join(' ')+'" data-d="'+d+'">'+d+'<span class="dots">'+(t?'<i class="dot'+(isB(t)?' b':'')+'"></i>':'')+'</span></button>';
  }
  $('g').innerHTML=h;
  const L=$('leap');
  if(m===1&&days===28&&DATA['02-29']){L.hidden=false;L.textContent='29 февраля (в високосный год): '+DATA['02-29']}else L.hidden=true;
  card();
}

let PH={};
try{PH=JSON.parse(localStorage.getItem('ph')||'{}')}catch(e){}
const savePH=()=>{try{localStorage.setItem('ph',JSON.stringify(PH));return true}catch(e){return false}};
const fi=document.createElement('input');fi.type='file';fi.accept='image/*';fi.id='fi';fi.className='fi';fi.tabIndex=-1;fi.setAttribute('aria-hidden','true');document.body.append(fi);
let target=null;
fi.onchange=()=>{
  const f=fi.files[0];fi.value='';if(!f||!target)return;
  const k=target,img=new Image(),u=URL.createObjectURL(f);
  img.onload=()=>{
    const s=240,side=Math.min(img.width,img.height),cv=document.createElement('canvas');
    cv.width=cv.height=s;
    cv.getContext('2d').drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,s,s);
    URL.revokeObjectURL(u);
    PH[k]=cv.toDataURL('image/jpeg',.82);
    if(!savePH()){delete PH[k];alert('Не удалось сохранить фото: память браузера заполнена или недоступна.')}
    render();
  };
  img.onerror=()=>{URL.revokeObjectURL(u);alert('Не удалось открыть файл. Выберите картинку JPG или PNG.')};
  img.src=u;
};
function card(){
  const t=DATA[key(m,sel)],c=$('c');
  c.innerHTML='';
  const head=document.createElement('div');head.className='hd';
  const box=document.createElement('div');
  const d=document.createElement('p');d.className='d';d.textContent=sel+' '+MG[m];box.append(d);
  if(!t){const p=document.createElement('p');p.className='t';p.textContent='На этот день записей нет';box.append(p);c.append(box);return}
  const b=isB(t),nm=b?person(t):null;
  const k=key(m,sel);
  const av=document.createElement('label');av.htmlFor='fi';av.tabIndex=0;av.className='av'+(nm?' b':'');av.setAttribute('aria-label','Добавить или заменить фото');
  if(PH[k]||BUILT[k]){const im=document.createElement('img');im.src=PH[k]||BUILT[k];im.alt='';av.append(im)}else av.textContent=nm?initials(nm):icon(t);
  av.onclick=()=>{target=k};av.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();target=k;fi.click()}};
  const p=document.createElement('p');p.className='t';p.textContent=t;
  const tag=document.createElement('span');tag.className='tag'+(b?' b':'');tag.textContent=b?'День рождения':'Праздник или памятная дата';
  box.append(p,tag);
  if(PH[k]){const rm=document.createElement('button');rm.type='button';rm.className='ph rm';rm.textContent='Убрать фото';
    rm.onclick=()=>{delete PH[k];savePH();render()};box.append(rm)}
  head.append(av,box);c.append(head);
}
$('g').onclick=e=>{const b=e.target.closest('.cell[data-d]');if(!b)return;sel=+b.dataset.d;render()};
$('pv').onclick=()=>{m=(m+11)%12;sel=1;render()};
$('nx').onclick=()=>{m=(m+1)%12;sel=1;render()};
$('tb').onclick=()=>{m=now.getMonth();sel=now.getDate();$('q').value='';$('res').innerHTML='';render()};
$('q').oninput=e=>{
  const q=e.target.value.trim().toLowerCase(),R=$('res');R.innerHTML='';
  if(q.length<2)return;
  const hits=Object.keys(DATA).sort().filter(k=>DATA[k].toLowerCase().includes(q)).slice(0,20);
  if(!hits.length){R.innerHTML='<p class="note">Ничего не найдено. Попробуйте другое слово.</p>';return}
  hits.forEach(k=>{const b=document.createElement('button');b.className='res';
    const mo=+k.slice(0,2)-1,d=+k.slice(3);
    b.innerHTML='<small>'+icon(DATA[k])+' '+d+' '+MG[mo]+'</small>';b.append(DATA[k]);
    b.onclick=()=>{m=mo;sel=d;render();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};R.append(b)});
};
render();
</script>
</body>
